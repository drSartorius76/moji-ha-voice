esphome:
  name: moji-ha-voice
  friendly_name: Moji HA Voice
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - micro_wake_word.start

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: Moji-HA-Recovery
    password: !secret recovery_ap_password

captive_portal:
api:
ota:
  - platform: esphome
    password: !secret ota_password
improv_serial:

i2c:
  - id: codec_i2c
    sda: GPIO5
    scl: GPIO4
    frequency: 400kHz
    scan: true

audio_dac:
  - platform: es8311
    id: moji_codec
    i2c_id: codec_i2c
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false
    mic_gain: 42DB

i2s_audio:
  - id: moji_i2s_mic
    i2s_mclk_pin: GPIO6
    i2s_bclk_pin:
      number: GPIO14
      allow_other_uses: true
    i2s_lrclk_pin:
      number: GPIO12
      allow_other_uses: true
  - id: moji_i2s_spk
    i2s_bclk_pin:
      number: GPIO14
      allow_other_uses: true
    i2s_lrclk_pin:
      number: GPIO12
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: moji_microphone
    i2s_audio_id: moji_i2s_mic
    i2s_din_pin: GPIO13
    adc_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: left

speaker:
  - platform: i2s_audio
    id: moji_speaker
    i2s_audio_id: moji_i2s_spk
    i2s_dout_pin: GPIO11
    i2s_mode: secondary
    dac_type: external
    audio_dac: moji_codec
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

media_player:
  - platform: speaker
    id: moji_media_player
    name: Moji Speaker
    announcement_pipeline:
      speaker: moji_speaker
      format: WAV
      sample_rate: 16000
      num_channels: 1

micro_wake_word:
  id: moji_wake_word
  microphone:
    microphone: moji_microphone
    channels: 0
    gain_factor: 4
  models:
    - model: okay_nabu
      probability_cutoff: 0.75
  on_wake_word_detected:
    - micro_wake_word.stop
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: moji_assist
  microphone: moji_microphone
  media_player: moji_media_player
  micro_wake_word: moji_wake_word
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0dBFS
  volume_multiplier: 1.0
  on_start:
    - light.turn_on:
        id: moji_status
        red: 0%
        green: 100%
        blue: 0%
        brightness: 40%
  on_end:
    - delay: 1s
    - micro_wake_word.start
    - light.turn_off: moji_status
  on_error:
    - delay: 1s
    - micro_wake_word.start
    - light.turn_on:
        id: moji_status
        red: 100%
        green: 0%
        blue: 0%
        brightness: 40%
    - delay: 2s
    - light.turn_off: moji_status

switch:
  - platform: gpio
    id: moji_amp_enable
    name: Moji Amplifier Enable
    internal: true
    pin: GPIO9
    restore_mode: ALWAYS_ON

sensor:
  - platform: wifi_signal
    name: Moji WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Moji Uptime
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: Moji Restart
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    id: moji_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: Moji Button
    on_press:
      - voice_assistant.start:
          silence_detection: false
    on_release:
      - voice_assistant.stop

light:
  - platform: esp32_rmt_led_strip
    id: moji_status
    pin: GPIO21
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    name: Moji Status LED
